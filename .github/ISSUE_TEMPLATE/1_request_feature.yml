name: Feature request
description: Suggest an improvement for Komiyomi's offline comic library or reader.
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem should this solve?
      description: Describe what you are trying to do with your local collection.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like Komiyomi to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional.
