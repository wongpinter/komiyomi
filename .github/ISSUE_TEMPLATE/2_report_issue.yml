name: Bug report
description: Report a problem with local CBZ/CBR browsing or reading.
title: "[Bug] "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Komiyomi version
      placeholder: For example, 1.0.0 or a commit hash
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Android version and device
    validations:
      required: true
  - type: input
    id: archive
    attributes:
      label: Archive type and size
      description: CBZ or CBR, approximate size, and whether it contains chapter folders.
      placeholder: CBZ, 1.4 GB, 24 chapter folders
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: 1. Open Library…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Comic files
      options:
        - label: I will not attach copyrighted comic files.
          required: true
